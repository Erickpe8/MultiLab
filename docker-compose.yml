services:
    multilab-mysql:
        image: mysql:9.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: multilab
            MYSQL_ROOT_PASSWORD: ""
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - app-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: multilab-phpmyadmin
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: multilab-mysql
            PMA_PORT: 3306
        depends_on:
            - multilab-mysql
        networks:
            - app-network

    laravel:
        build: .
        container_name: multilab-laravel
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "8000:8000"
        depends_on:
            - multilab-mysql
        command: sh -c "if [ ! -d vendor ]; then composer install; fi && if [ ! -f .env ]; then cp .env.example .env && php artisan key:generate; fi && php artisan serve --host=0.0.0.0 --port=8000"
        networks:
            - app-network

volumes:
    mysql_data:

networks:
    app-network:
        driver: bridge
