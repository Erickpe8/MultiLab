services:
    mysql:
        image: mysql:9.4
        container_name: multilab-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: multilab
            MYSQL_ROOT_PASSWORD: root
        volumes:
            -   mysql_data:/var/lib/mysql
        networks:
            -   app-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: multilab-phpmyadmin
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mysql
        depends_on:
            -   mysql
        networks:
            -   app-network

    app:
        build: .
        container_name: multilab-laravel
        working_dir: /var/www
        volumes:
            -   .:/var/www
        ports:
            -   "8000:8000"
        depends_on:
            -   mysql
        command: php artisan serve --host=0.0.0.0 --port=8000
        networks:
            -   app-network

volumes:
    mysql_data:

networks:
    app-network:
